name: Deploy to GitHub Pages

# Publishes the built app to the gh-pages branch; GitHub Pages serves that
# branch (Settings → Pages → Source: Deploy from a branch → gh-pages).
# The actions/deploy-pages API route was abandoned — it rejected every
# deployment for this site with a generic error; the branch route works.

on:
  push:
    branches: [claude/fitness-health-tracking-app-f7yhxv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # SPA fallback + skip Jekyll processing on Pages.
      - run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
