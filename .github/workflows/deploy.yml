name: Deploy to GitHub Pages

# Publishes the built app to the gh-pages branch; GitHub Pages serves that
# branch (Settings → Pages → Source: Deploy from a branch → gh-pages).
# The actions/deploy-pages API route was abandoned — it rejected every
# deployment for this site with a generic error; the branch route works.
# A final step watches GitHub's own "pages build and deployment" and re-runs it
# on the transient "Deployment failed, try again later" flake, so a hiccup can't
# silently leave the live site on an old build.

on:
  push:
    branches: [claude/fitness-health-tracking-app-f7yhxv]
  workflow_dispatch:

permissions:
  contents: write
  # actions: write lets the verify step re-run GitHub's Pages publish on a flake.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # SPA fallback + skip Jekyll processing on Pages.
      - run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          # Record the exact gh-pages commit we just pushed. GitHub's own
          # "pages build and deployment" run carries THIS commit as its head_sha,
          # so the verify step below can watch our own publish run rather than a
          # previous one (which raced and passed instantly before this fix).
          echo "PAGES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub's own "pages build and deployment" (which actually serves the site)
      # occasionally fails with a transient "Deployment failed, try again later",
      # silently leaving the live site on the previous build. Watch that run and
      # re-run it a few times so a flake can't strand a deploy unnoticed.
      - name: Verify Pages publish and retry transient failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The gh-pages commit we just pushed; its publish run has this head_sha.
          SHA: ${{ env.PAGES_SHA }}
        run: |
          echo "Waiting for GitHub's Pages publish of ${SHA} to start…"
          run_id=""
          # Match the publish run by OUR gh-pages commit SHA — otherwise we could
          # grab a previous, already-successful run that GitHub hasn't superseded
          # yet and pass in ~2s without ever watching this deploy (the old race).
          # Poll up to ~5 min: GitHub can lag before creating the run.
          for _ in $(seq 1 30); do
            run_id=$(gh run list --branch gh-pages --limit 30 \
              --json databaseId,headSha,workflowName,name \
              --jq 'map(select(.headSha == env.SHA and (((.workflowName // "") + " " + (.name // "")) | test("pages build and deployment"))))[0].databaseId // empty' \
              2>/dev/null || true)
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::warning::Couldn't find the Pages publish run for ${SHA} — skipping auto-retry (the build+push already succeeded)."
            exit 0
          fi
          echo "Watching Pages publish run $run_id (commit ${SHA})"
          for attempt in 1 2 3; do
            if gh run watch "$run_id" --exit-status >/dev/null 2>&1; then
              echo "✅ GitHub Pages published successfully (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Pages publish attempt $attempt failed — re-running…"
            gh run rerun "$run_id" --failed >/dev/null 2>&1 || gh run rerun "$run_id" >/dev/null 2>&1 || true
            sleep 20
          done
          echo "::error::GitHub Pages publish still failing after 3 attempts — re-run this workflow to try again."
          exit 1
